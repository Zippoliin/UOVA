<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Life RPG"/>
  <meta name="theme-color" content="#080810"/>
  <meta name="description" content="Gamifica la tua vita reale. Costruisci abitudini, guadagna XP, scala i livelli."/>

  <title>Life RPG</title>

  <!-- App icons (replace with your own) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <link rel="manifest" href="/manifest.json"/>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100%;height:100%;overflow-x:hidden;background:#080810}
    body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    /* Prevent iOS rubber-band scroll on the root */
    #root{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (CDN — swap for bundled build in production) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel" src="/App.jsx" data-type="module"></script>

  <script>
    // Mount React app
    document.addEventListener('DOMContentLoaded', () => {
      // Service Worker registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      }
    });

  </script>
</body>
</html>
